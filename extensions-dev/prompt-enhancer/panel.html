<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Prompt Enhancer</title>
    <style>
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        box-sizing: border-box;
        padding: 12px 14px 16px;
        overflow: auto;
        background: transparent;
        color: var(--muxy-foreground);
        font: 13px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .status,
      .note,
      .foot {
        margin: 0;
        color: var(--muxy-foreground-muted);
      }
      .status:empty,
      .note:empty {
        display: none;
      }
      .status {
        margin-bottom: 8px;
      }
      .list {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 6px 8px;
        border-radius: 6px;
      }
      .row input {
        flex: none;
      }
      .row:hover {
        background: var(--muxy-hover);
      }
      .row:has(input:checked) {
        background: var(--muxy-accent-soft);
      }
      .row:has(input:disabled) {
        color: var(--muxy-foreground-muted);
      }
      .name {
        flex: 1;
        min-width: 8em;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .meta {
        color: var(--muxy-foreground-muted);
        font-size: 12px;
        white-space: nowrap;
      }
      .field {
        display: block;
        margin: 14px 0 4px;
      }
      input[type="text"] {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        border: 1px solid var(--muxy-border);
        border-radius: 6px;
        background: var(--muxy-surface);
        color: var(--muxy-foreground);
        font: inherit;
      }
      input[type="text"]:focus {
        outline: 2px solid var(--muxy-accent);
        outline-offset: 1px;
      }
      .note {
        margin-top: 6px;
      }
      .note.error {
        color: var(--muxy-diff-remove);
      }
      .actions {
        margin-top: 12px;
      }
      button {
        padding: 4px 10px;
        border: 1px solid var(--muxy-border);
        border-radius: 6px;
        background: var(--muxy-surface);
        color: var(--muxy-foreground);
        font: inherit;
      }
      button:disabled {
        color: var(--muxy-foreground-muted);
      }
      .foot {
        margin-top: 12px;
      }
    </style>
  </head>
  <body>
    <p id="status" class="status">Looking for installed CLIs…</p>
    <div id="list" class="list" role="radiogroup" aria-label="CLI"></div>
    <label class="field" for="model">Model</label>
    <input id="model" type="text" autocomplete="off" spellcheck="false" placeholder="CLI default" />
    <p id="model-note" class="note"></p>
    <div class="actions">
      <button id="refresh" type="button">Refresh</button>
    </div>
    <p class="foot">Extra instructions are on this extension's settings page.</p>
    <script src="panel.js"></script>
  </body>
</html>
